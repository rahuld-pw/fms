<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Campus Ops</title>
<link rel="icon" href="/icon.svg">
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1c1917; --muted: #78716c; --primary: #1f9d55; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --fg: #fafaf9; --muted: #a8a29e; } }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 6px; line-height: 1.5; }
  button { margin-top: 18px; background: var(--primary); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="">
  <h1>You're offline</h1>
  <p>Campus Ops needs an internet connection. Check your connection and try again.</p>
  <p lang="hi">आप ऑफ़लाइन हैं। इंटरनेट कनेक्शन जाँचें और फिर से कोशिश करें।</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
